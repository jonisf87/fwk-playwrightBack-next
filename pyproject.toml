# KEY DIFFERENCE: Python uses a single pyproject.toml (PEP 518/621) where TypeScript
# splits config across package.json, tsconfig.json, and eslint.config.mjs.
# All tools (ruff, mypy, pytest, taskipy) read from this one file.

# Build system — required for 'pip install -e ".[dev]"' to work in CI.
# TypeScript has no equivalent: npm install reads package.json directly.
# Python needs a declared build backend (setuptools, hatchling, flit, etc.).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fwk-playwright-back-next"
version = "1.0.0"
description = "E2E Playwright + Python + pytest — BDD/POM and native approaches for demoqa.com"
requires-python = ">=3.11"

# KEY DIFFERENCE: TypeScript separates dependencies (package.json "dependencies")
# from devDependencies. Python projects used for testing are entirely dev-facing,
# so everything goes under optional-dependencies["dev"].
# Install with: pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    # Browser automation — same API surface as TypeScript Playwright
    "playwright>=1.44.0",
    # Test runner — replaces Cucumber.js as the execution engine
    "pytest>=8.0.0",
    # Async test support — required because playwright-python uses asyncio.
    # KEY DIFFERENCE: pinned to <1.0 — pytest-asyncio 1.x broke async step execution
    # with pytest-bdd v8: the bdd wrapper does not preserve the coroutine nature of
    # async step functions, so pytest-asyncio 1.x never awaits them. Fixtures receive
    # a raw coroutine object instead of the resolved value (silent bug: sync @then steps
    # fail, async @then steps "pass" vacuously because no assertion runs).
    # 0.23.x handles this correctly with asyncio_mode = "auto".
    "pytest-asyncio>=0.23.0,<1.0",
    # BDD/Gherkin layer — replaces @cucumber/cucumber (branch feature/bdd-pom only).
    # KEY DIFFERENCE: pinned to <8.0 — pytest-bdd v8 changed step discovery from a
    # global registry (v7) to pytest's fixture mechanism. Steps defined in one module
    # are no longer visible to tests in other modules unless exported via conftest.py.
    # Pinning to v7 keeps the global registry behaviour that matches the TS/Cucumber
    # auto-discovery model and avoids cross-module re-export boilerplate in conftest.
    "pytest-bdd>=7.0.0,<8.0",
    # Test data generation — replaces @faker-js/faker
    "Faker>=25.0.0",
    # Linter + formatter — replaces ESLint AND Prettier in a single Rust binary
    "ruff>=0.5.0",
    # Static type checker — replaces tsc --noEmit
    "mypy>=1.10.0",
    # Task runner — replaces npm scripts ("task lint" instead of "npm run lint")
    "taskipy>=1.13.0",
    # Local git hooks — no direct TS equivalent (was CI-only in the original project)
    "pre-commit>=3.7.0",
    # HTML test reports — replaces Cucumber's --format html reporter
    "pytest-html>=4.0.0",
]

# KEY DIFFERENCE: taskipy replaces npm scripts.
# TypeScript: "scripts": { "lint": "eslint .", "test": "cucumber-js ..." }
# Python:     [tool.taskipy.tasks] lint = "ruff check ."
# Usage: task <name>  (instead of: npm run <name>)
[tool.taskipy.tasks]
generate-data = "python tests/support/generate_data.py"
lint          = "ruff check ."
format-check  = "ruff format --check ."
format        = "ruff format ."
typecheck     = "mypy tests"
test-ui       = "pytest tests/ -m 'not api' -v"
test-api      = "pytest tests/ -m api -v"
test          = "pytest tests/ -v"
codegen       = "playwright codegen https://demoqa.com/register"

# KEY DIFFERENCE: ruff replaces both ESLint and Prettier.
# TypeScript used two separate tools with two separate configs.
# ruff handles linting (ruff check) and formatting (ruff format) from one config.
# It is 10-100x faster than ESLint because it is written in Rust.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Rule sets selected (equivalents to ESLint rule packs):
#   E/W = pycodestyle errors/warnings  (equiv: eslint:recommended)
#   F   = pyflakes (unused imports, undefined names)
#   I   = isort (import ordering)      (equiv: eslint-plugin-import)
#   N   = pep8-naming conventions
#   UP  = pyupgrade (modern Python syntax)
select = ["E", "F", "I", "N", "UP", "W"]
ignore = [
    "E501",  # line too long — handled by formatter, not linter
]

[tool.ruff.lint.per-file-ignores]
# Relax naming rules in step definitions — BDD step strings use natural language
"tests/steps/**" = ["N802", "N803"]
# Test files: allow assert statements and magic method usage
"tests/test_*.py" = ["N802"]

# KEY DIFFERENCE: mypy replaces tsc --noEmit.
# TypeScript: "strict": true in tsconfig.json
# Python:     strict = true in [tool.mypy]
# Both enforce: no implicit any/unknown, exhaustive null checks, strict function types.
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true  # third-party stubs not always available
# Exclude test infrastructure files where @pytest.fixture / dynamic injection
# makes mypy strict mode raise false positives:
#   tests/conftest  — @pytest.fixture has no complete ParamSpec stubs in typeshed;
#                     known mypy+pytest limitation, not a code quality issue.
#   tests/steps/    — pytest-bdd injects fixtures dynamically; params look "unused".
#   tests/test_     — native test files use the same dynamic injection pattern.
exclude = ["tests/conftest", "tests/steps/", "tests/test_"]

[[tool.mypy.overrides]]
# Page objects and support code: full strict checking
module = ["tests.pages.*", "tests.support.*"]
strict = true

# Central pytest configuration — partially replaces playwright.config.ts
# TypeScript playwright.config.ts set: testDir, headless, screenshot, video, baseURL, reporter
# Python splits these: pytest options here, browser config in conftest.py fixtures
[tool.pytest.ini_options]
# KEY DIFFERENCE: This branch uses playwright.sync_api — no asyncio_mode needed.
# asyncio_mode = "auto" is required in the native branch (feature/native-playwright)
# where test functions are async def and pytest-asyncio manages the event loop.
# Here all Playwright calls are synchronous; pytest runs step functions normally.
# Custom markers — equivalent to Cucumber's @ui and @api tags
# Run with: pytest -m api  or  pytest -m "not api"
markers = [
    "api: API-only tests, no browser required",
    "ui: UI tests requiring a browser context",
]
# Test discovery — equivalent to testDir in playwright.config.ts
testpaths = ["tests"]
# KEY DIFFERENCE: PYTHONPATH — pytest-bdd imports like 'from tests.pages.x import X'
# require the project root on sys.path. TypeScript Cucumber resolves modules via
# node_modules resolution; Python needs an explicit root entry so relative imports work
# both locally and in CI (where the working directory may differ).
pythonpath = ["."]
# KEY DIFFERENCE: pytest only collects files matching test_*.py by default.
# *_steps.py files must be explicitly added so scenarios() creates test functions.
# TypeScript Cucumber auto-discovers steps via --require glob — no config needed.
python_files = ["test_*.py", "*_steps.py"]
# Suppress known third-party warnings that clutter output
filterwarnings = [
    "ignore::DeprecationWarning:pytest_bdd",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
